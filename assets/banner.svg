<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#070a12"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cardGrad" x1="0%" x2="0%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".8"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".9"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulse{0%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}@keyframes scanline{0%{transform:translateY(0)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-25px) translateX(15px);opacity:.8}}@keyframes pillFloat1{0%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes pillFloat2{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes beamMove{0%{stroke-dashoffset:400}}.pulsing-orb-1{animation:pulse 7s ease-in-out infinite;transform-origin:200px 100px}.pulsing-orb-2{animation:pulse 9s ease-in-out infinite reverse;transform-origin:1000px 320px}.particle-1{animation:floatParticle 6s ease-in-out infinite}.particle-2{animation:floatParticle 8s ease-in-out infinite 1s}.particle-3{animation:floatParticle 7s ease-in-out infinite 2s}.pill-1{animation:pillFloat1 5s ease-in-out infinite}.pill-2{animation:pillFloat2 6s ease-in-out infinite .5s}.pill-3{animation:pillFloat1 5.5s ease-in-out infinite 1s}.pill-4{animation:pillFloat2 6.5s ease-in-out infinite 1.5s}.beam{stroke-dasharray:80 120;animation:beamMove 8s linear infinite}.title-text{font-weight:800;letter-spacing:-.5px}.subtitle-text,.tag-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,Helvetica,Arial,sans-serif}.subtitle-text{font-weight:500;letter-spacing:.2px}.tag-text{font-weight:600;font-size:13px}</style><rect width="1200" height="420" fill="url(#bgGrad)"/><rect width="1200" height="420" fill="url(#grid)"/><circle cx="200" cy="100" r="140" fill="#38bdf8" class="pulsing-orb-1" filter="url(#glow)" opacity=".25"/><circle cx="1020" cy="300" r="160" fill="#a855f7" class="pulsing-orb-2" filter="url(#glow)" opacity=".25"/><circle cx="600" cy="210" r="180" fill="#6366f1" filter="url(#glow)" opacity=".12"/><circle cx="160" cy="280" r="3" fill="#38bdf8" class="particle-1"/><circle cx="320" cy="80" r="2.5" fill="#818cf8" class="particle-2"/><circle cx="1050" cy="140" r="3.5" fill="#c084fc" class="particle-3"/><circle cx="890" cy="360" r="2" fill="#38bdf8" class="particle-1"/><circle cx="720" cy="60" r="3" fill="#a855f7" class="particle-2"/><path fill="none" stroke="url(#accentGrad)" stroke-width="2" d="M 50 370 Q 300 390 600 370 T 1150 370" class="beam" opacity=".4"/><path fill="none" stroke="url(#accentGrad)" stroke-width="1.5" d="M 80 50 Q 400 30 700 50 T 1120 50" class="beam" opacity=".3"/><g transform="translate(460, 48)"><rect width="280" height="28" x="0" y="0" fill="#1e293b" stroke="#38bdf8" stroke-opacity=".6" stroke-width="1" rx="14"/><circle cx="16" cy="14" r="5" fill="#10b981"/><text x="32" y="19" fill="#94a3b8" class="tag-text">CURATED SECURITY KNOWLEDGE</text></g><g><text fill="#fff" class="title-text" font-size="44" text-anchor="middle" transform="translate(600, 142)">Awesome <tspan fill="url(#accentGrad)">Column-Level</tspan> Data Security</text></g><g><text fill="#94a3b8" class="subtitle-text" font-size="18" text-anchor="middle" transform="translate(600, 192)">Dynamic Data Masking • Format-Preserving Encryption • Tokenization • ABAC &amp; CLS</text></g><g><text fill="#64748b" class="subtitle-text" font-size="14" text-anchor="middle" transform="translate(600, 226)">The authoritative reference for enterprise data protection, privacy engineering, and zero-trust data architectures</text></g><g class="pill-1" transform="translate(140, 280)"><rect width="210" height="46" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity=".7" stroke-width="1.2" rx="10"/><text x="20" y="28" font-size="18">🎭</text><text x="48" y="28" fill="#e2e8f0" class="tag-text">Dynamic Masking</text></g><g class="pill-2" transform="translate(380, 280)"><rect width="210" height="46" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity=".7" stroke-width="1.2" rx="10"/><text x="20" y="28" font-size="18">🔐</text><text x="48" y="28" fill="#e2e8f0" class="tag-text">FPE &amp; Tokenization</text></g><g class="pill-3" transform="translate(620, 280)"><rect width="200" height="46" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity=".7" stroke-width="1.2" rx="10"/><text x="20" y="28" font-size="18">🛡️</text><text x="48" y="28" fill="#e2e8f0" class="tag-text">ABAC &amp; CLS Policies</text></g><g class="pill-4" transform="translate(850, 280)"><rect width="210" height="46" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity=".7" stroke-width="1.2" rx="10"/><text x="20" y="28" font-size="18">⚡</text><text x="48" y="28" fill="#e2e8f0" class="tag-text">Zero-Trust Audit</text></g><rect width="1200" height="4" x="0" y="416" fill="url(#accentGrad)"/></svg>