<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Animated Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.08); }
    }
    @keyframes scanline {
      0% { transform: translateY(0); }
      100% { transform: translateY(420px); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0) translateX(0); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0) translateX(0); opacity: 0.2; }
    }
    @keyframes pillFloat1 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pillFloat2 {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes beamMove {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }

    .pulsing-orb-1 {
      animation: pulse 7s ease-in-out infinite;
      transform-origin: 200px 100px;
    }
    .pulsing-orb-2 {
      animation: pulse 9s ease-in-out infinite reverse;
      transform-origin: 1000px 320px;
    }
    .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
    .particle-2 { animation: floatParticle 8s ease-in-out infinite 1s; }
    .particle-3 { animation: floatParticle 7s ease-in-out infinite 2s; }
    .pill-1 { animation: pillFloat1 5s ease-in-out infinite; }
    .pill-2 { animation: pillFloat2 6s ease-in-out infinite 0.5s; }
    .pill-3 { animation: pillFloat1 5.5s ease-in-out infinite 1s; }
    .pill-4 { animation: pillFloat2 6.5s ease-in-out infinite 1.5s; }
    .beam {
      stroke-dasharray: 80 120;
      animation: beamMove 8s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      letter-spacing: 0.2px;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Animated Background Glow Orbs -->
  <circle class="pulsing-orb-1" cx="200" cy="100" r="140" fill="#38bdf8" opacity="0.25" filter="url(#glow)" />
  <circle class="pulsing-orb-2" cx="1020" cy="300" r="160" fill="#a855f7" opacity="0.25" filter="url(#glow)" />
  <circle cx="600" cy="210" r="180" fill="#6366f1" opacity="0.12" filter="url(#glow)" />

  <!-- Floating Dynamic Particles in Background -->
  <circle class="particle-1" cx="160" cy="280" r="3" fill="#38bdf8" />
  <circle class="particle-2" cx="320" cy="80" r="2.5" fill="#818cf8" />
  <circle class="particle-3" cx="1050" cy="140" r="3.5" fill="#c084fc" />
  <circle class="particle-1" cx="890" cy="360" r="2" fill="#38bdf8" />
  <circle class="particle-2" cx="720" cy="60" r="3" fill="#a855f7" />

  <!-- Flow Circuit Decorative Connectors (Background) -->
  <path class="beam" d="M 50 370 Q 300 390 600 370 T 1150 370" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4" />
  <path class="beam" d="M 80 50 Q 400 30 700 50 T 1120 50" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.3" />

  <!-- Top Decorative Header Tag -->
  <g transform="translate(460, 48)">
    <rect x="0" y="0" width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
    <circle cx="16" cy="14" r="5" fill="#10b981" />
    <text x="32" y="19" fill="#94a3b8" class="tag-text">CURATED SECURITY KNOWLEDGE</text>
  </g>

  <!-- Foreground Main Title -->
  <g transform="translate(600, 142)">
    <text text-anchor="middle" class="title-text" font-size="44" fill="#ffffff">
      Awesome <tspan fill="url(#accentGrad)">Column-Level</tspan> Data Security
    </text>
  </g>

  <!-- Foreground Subtitle -->
  <g transform="translate(600, 192)">
    <text text-anchor="middle" class="subtitle-text" font-size="18" fill="#94a3b8">
      Dynamic Data Masking • Format-Preserving Encryption • Tokenization • ABAC &amp; CLS
    </text>
  </g>

  <!-- Foreground Tagline / Description -->
  <g transform="translate(600, 226)">
    <text text-anchor="middle" class="subtitle-text" font-size="14" fill="#64748b">
      The authoritative reference for enterprise data protection, privacy engineering, and zero-trust data architectures
    </text>
  </g>

  <!-- Foreground Feature Badges / Animated Interactive Elements -->
  <!-- Pill 1: Dynamic Masking -->
  <g class="pill-1" transform="translate(140, 280)">
    <rect width="210" height="46" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.7"/>
    <text x="20" y="28" font-size="18">🎭</text>
    <text x="48" y="28" fill="#e2e8f0" class="tag-text">Dynamic Masking</text>
  </g>

  <!-- Pill 2: FPE & Tokenization -->
  <g class="pill-2" transform="translate(380, 280)">
    <rect width="210" height="46" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.7"/>
    <text x="20" y="28" font-size="18">🔐</text>
    <text x="48" y="28" fill="#e2e8f0" class="tag-text">FPE &amp; Tokenization</text>
  </g>

  <!-- Pill 3: ABAC & RLS/CLS -->
  <g class="pill-3" transform="translate(620, 280)">
    <rect width="200" height="46" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.7"/>
    <text x="20" y="28" font-size="18">🛡️</text>
    <text x="48" y="28" fill="#e2e8f0" class="tag-text">ABAC &amp; CLS Policies</text>
  </g>

  <!-- Pill 4: Zero-Trust Governance -->
  <g class="pill-4" transform="translate(850, 280)">
    <rect width="210" height="46" rx="10" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.7"/>
    <text x="20" y="28" font-size="18">⚡</text>
    <text x="48" y="28" fill="#e2e8f0" class="tag-text">Zero-Trust Audit</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="0" y="416" width="1200" height="4" fill="url(#accentGrad)" />
</svg>
